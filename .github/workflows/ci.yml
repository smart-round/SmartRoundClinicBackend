name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  IMAGE_NAME: smartround/smartroundclinic-backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # ApplicationTest boots the full Koin graph, which needs a live Redis. The real REDIS_URL
      # secret points at a self-hosted VPS with a firewall that only reliably allows the prod
      # host's own IP — GitHub's ephemeral runner IPs get through sometimes and time out other
      # times, making :test intermittently fail for commits that never touch Redis at all. This
      # container gives CI its own always-reachable Redis; REDIS_URL is overridden below to point
      # at it (EnvLoader lets a real env var win over the .env file's value).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write .env
        run: printf '%s\n' "${{ secrets.ENV_FILE }}" > .env

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  build-and-push:
    needs: test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            TAGS="${IMAGE_NAME}:pr-${PR_NUM},${IMAGE_NAME}:pr-${PR_NUM}-sha-${SHORT_SHA}"
          else
            TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:sha-${SHORT_SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest image, recreate, verify, prune
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/smart-round/backend
            docker compose pull backend
            # --wait fails the step (and the deploy) if the container doesn't reach a
            # running/healthy state, instead of silently leaving a crashed container behind.
            docker compose up -d --wait backend
            docker compose ps backend
            # Dangling only — the just-replaced backend image, not other services' tagged images.
            docker image prune -f
