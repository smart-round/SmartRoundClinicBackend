services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartroundclinic-backend:latest
    container_name: smartroundclinic-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
